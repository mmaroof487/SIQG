services:
  gateway:
    build:
      context: ./gateway
      network: host
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./gateway:/app
      - ./tests:/app/tests
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - argus_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction!}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-argus_admin} -d $${POSTGRES_DB:-argus} -h localhost"]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - argus_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

  postgres_replica:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-argus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeInProduction!}
      POSTGRES_DB: ${POSTGRES_DB:-argus}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-argus_admin} -d $${POSTGRES_DB:-argus} -h localhost"]
      interval: 3s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - argus_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure-redis-pass}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:-secure-redis-pass}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - argus_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend-ts
      network: host
    restart: unless-stopped
    ports:
      - "3001:3001"
    depends_on:
      - gateway
    volumes:
      - ./frontend-ts:/app
      - /app/node_modules
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - argus_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  pg_data:

networks:
  argus_net:
    driver: bridge
